name: Native Windows and Linux
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install -r requirements.lock.txt
      - name: Fetch checksummed official native xTB (CI only)
        run: python tools/ci_engine.py "${{ runner.temp }}/xtb"
      - run: python -m pytest -q
      - run: python tools/portable.py check
      - name: Native command launcher check
        if: runner.os == 'Windows'
        shell: cmd
        run: Start-Windows.cmd check
      - run: python tools/audit_release.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: node frontend/unit/model.test.mjs
