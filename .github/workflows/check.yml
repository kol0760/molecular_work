name: Offline checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install -r requirements.lock.txt
      - run: python -m pytest tests/test_slurm.py tests/test_navigation.py tests/test_local_access.py tests/test_portable.py -q
      - run: python tools/audit_release.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: node frontend/unit/model.test.mjs
